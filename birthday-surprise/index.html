<!doctype html>
<html lang="ne" class="is-locked">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#180B1D">
  <!-- Private page: ask search engines not to index it (this is NOT access control). -->
  <meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
  <meta name="referrer" content="no-referrer">
  <title>मेरो संसार, मेरी उनी ❤️</title>

  <!-- Self-hosted fonts (no third-party requests) -->
  <link rel="preload" href="assets/fonts/NotoSerifDevanagari-devanagari-cffc5e.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 28S3 20 3 11.5A6.5 6.5 0 0 1 16 8a6.5 6.5 0 0 1 13 3.5C29 20 16 28 16 28z' fill='%23E88CA7'/%3E%3C/svg%3E">

  <script src="js/config.js" defer></script>
  <script src="js/script.js" defer></script>
</head>
<body>


  <!-- Shared SVG definitions (heart shape + gradients) -->
  <svg class="svg-defs" aria-hidden="true" focusable="false" width="0" height="0">
    <defs>
      <linearGradient id="g-heart" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#F5CCD5"/>
        <stop offset=".45" stop-color="#E88CA7"/>
        <stop offset="1" stop-color="#9E3A5E"/>
      </linearGradient>
      <linearGradient id="g-gold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FFF3E8"/>
        <stop offset=".4" stop-color="#E8C98B"/>
        <stop offset="1" stop-color="#B8894A"/>
      </linearGradient>
      <symbol id="i-heart" viewBox="0 0 64 58">
        <path d="M32 56S2 37.5 2 18.5C2 9 9.4 2 18 2c6 0 11 3.2 14 8.2C35 5.2 40 2 46 2c8.6 0 16 7 16 16.5C62 37.5 32 56 32 56z"/>
      </symbol>
    </defs>
  </svg>

  <!-- Fixed ambient light layer: bokeh + slow golden dust -->
  <div class="ambient" aria-hidden="true">
    <div class="ambient__bokeh"></div>
    <div class="ambient__dust" id="ambient-dust"></div>
  </div>

  <!-- =============================================================
       1. CINEMATIC OPENING
       ============================================================= -->
  <section class="intro" id="intro" aria-labelledby="intro-title">
    <div class="intro__glow" aria-hidden="true"></div>
    <div class="intro__petals" id="intro-petals" aria-hidden="true"></div>
    <div class="intro__dust" id="intro-dust" aria-hidden="true"></div>

    <div class="intro__stage">
      <svg class="intro__heart" id="intro-heart" aria-hidden="true" focusable="false">
        <use href="#i-heart" fill="url(#g-heart)" stroke="url(#g-gold)" stroke-width="1.4"/>
      </svg>

      <p class="intro__line intro__line--1" data-t="intro.line1"></p>
      <h1 class="intro__line intro__line--2" id="intro-title" data-t="intro.line2"></h1>
      <p class="intro__line intro__line--3" data-t="intro.surprise"></p>

      <button class="btn btn--primary intro__btn" id="intro-btn" type="button">
        <span data-t="intro.button"></span>
      </button>
    </div>
    <div class="intro__flood" aria-hidden="true"></div>
  </section>

  <noscript>
    <p class="noscript">यो सरप्राइज हेर्न ब्राउजरमा JavaScript खोल्नुपर्छ ❤️</p>
  </noscript>

  <main id="main" class="main" inert>

    <!-- ===========================================================
         2. GRAND BIRTHDAY HERO
         =========================================================== -->
    <section class="hero" id="hero" aria-labelledby="hero-title">
      <figure class="hero__portrait">
        <div class="hero__halo" aria-hidden="true"></div>
        <div class="arch" id="hero-arch">
          <img id="hero-img" class="arch__img" alt="" decoding="async" fetchpriority="high">
        </div>
        <span class="spark spark--a" aria-hidden="true"></span>
        <span class="spark spark--b" aria-hidden="true"></span>
        <span class="spark spark--c" aria-hidden="true"></span>
      </figure>

      <div class="hero__text">
        <p class="eyebrow hero__eyebrow" data-t="hero.eyebrow"></p>
        <p class="hero__name" id="hero-name" hidden></p>
        <h2 class="hero__title" id="hero-title" tabindex="-1" data-t="hero.headline"></h2>
        <div class="ornament" aria-hidden="true"><span></span><svg><use href="#i-heart"/></svg><span></span></div>
        <p class="hero__message" data-t="hero.message"></p>
        <p class="date-chip">
          <span data-t="hero.dateLabel"></span>
          <strong data-t="birthDateBS"></strong>
        </p>
      </div>

      <a class="scroll-cue" href="#journey">
        <span data-t="hero.scrollHint"></span>
        <svg class="scroll-cue__arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </section>

    <!-- ===========================================================
         3. SEVEN PHOTOGRAPHS — SEVEN EMOTIONS
         =========================================================== -->
    <section class="journey" id="journey" aria-labelledby="journey-title">
      <header class="section-head reveal">
        <p class="eyebrow" data-t="gallery.kicker"></p>
        <h2 class="section-title" id="journey-title" data-t="gallery.title"></h2>
        <p class="section-hint" data-t="gallery.hint"></p>
      </header>
      <ol class="moments" id="moments"></ol>
    </section>

    <!-- ===========================================================
         4. LOVE LETTER
         =========================================================== -->
    <section class="letter-section" id="letter" aria-labelledby="letter-title">
      <header class="section-head reveal">
        <p class="eyebrow" data-t="letter.kicker"></p>
        <h2 class="section-title" id="letter-title" data-t="letter.title"></h2>
      </header>

      <div class="envelope-wrap reveal" id="envelope-wrap">
        <button class="envelope" id="envelope" type="button" aria-controls="letter-paper" aria-expanded="false">
          <span class="visually-hidden" data-t="letter.envelopeLabel"></span>
          <span class="envelope__back" aria-hidden="true"></span>
          <span class="envelope__paper" aria-hidden="true"></span>
          <span class="envelope__pocket" aria-hidden="true"></span>
          <span class="envelope__flap" aria-hidden="true"></span>
          <span class="envelope__seal" aria-hidden="true">
            <svg><use href="#i-heart"/></svg>
          </span>
        </button>
        <button class="btn btn--primary" id="letter-btn" type="button" aria-controls="letter-paper" aria-expanded="false">
          <span data-t="letter.button"></span>
        </button>
      </div>

      <article class="paper" id="letter-paper" hidden tabindex="-1" aria-labelledby="letter-title">
        <div class="paper__body" id="letter-body"></div>
        <div class="paper__sign">
          <p data-t="letter.signOff"></p>
          <p class="paper__signature" data-t="letter.signature"></p>
          <p class="paper__sender" id="letter-sender" hidden></p>
        </div>
        <button class="btn btn--ghost paper__close" id="letter-close" type="button">
          <span data-t="letter.closeButton"></span>
        </button>
      </article>
    </section>

    <!-- ===========================================================
         5. BIRTHDAY CELEBRATION
         =========================================================== -->
    <section class="celebration" id="celebration" aria-labelledby="cake-title">
      <header class="section-head reveal">
        <p class="eyebrow" data-t="cake.kicker"></p>
        <h2 class="section-title" id="cake-title" data-t="cake.title"></h2>
        <p class="section-hint" data-t="cake.hint"></p>
      </header>

      <div class="cake-stage reveal" id="cake-stage">
        <div class="cake-stage__light" aria-hidden="true"></div>
        <svg class="cake" id="cake" viewBox="0 0 320 340" role="img" aria-labelledby="cake-label">
          <title id="cake-label" data-t="cake.cakeLabel"></title>
          <defs>
            <linearGradient id="g-tier1" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#B9587B"/>
              <stop offset=".3" stop-color="#E88CA7"/>
              <stop offset=".62" stop-color="#F0A4BA"/>
              <stop offset="1" stop-color="#A8496C"/>
            </linearGradient>
            <linearGradient id="g-tier2" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#D99AAE"/>
              <stop offset=".35" stop-color="#F5CCD5"/>
              <stop offset=".65" stop-color="#FBE0E6"/>
              <stop offset="1" stop-color="#CF8EA3"/>
            </linearGradient>
            <linearGradient id="g-cream" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#EBD9C8"/>
              <stop offset=".45" stop-color="#FFF3E8"/>
              <stop offset="1" stop-color="#E3CDB9"/>
            </linearGradient>
            <linearGradient id="g-band" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#A9793C"/>
              <stop offset=".4" stop-color="#F4DCA6"/>
              <stop offset=".6" stop-color="#E8C98B"/>
              <stop offset="1" stop-color="#9C6E35"/>
            </linearGradient>
            <linearGradient id="g-candle" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#E6D3C2"/>
              <stop offset=".5" stop-color="#FFF8F0"/>
              <stop offset="1" stop-color="#D8C2AE"/>
            </linearGradient>
            <radialGradient id="g-rose" cx=".4" cy=".35" r=".7">
              <stop offset="0" stop-color="#F5CCD5"/>
              <stop offset=".5" stop-color="#D86A8E"/>
              <stop offset="1" stop-color="#7E2547"/>
            </radialGradient>
            <radialGradient id="g-plate" cx=".5" cy=".4" r=".6">
              <stop offset="0" stop-color="#F4DCA6"/>
              <stop offset="1" stop-color="#8E6230"/>
            </radialGradient>
          </defs>

          <!-- plate -->
          <ellipse cx="160" cy="312" rx="138" ry="18" fill="url(#g-plate)"/>
          <ellipse cx="160" cy="308" rx="128" ry="13" fill="#2a0f1c" opacity=".25"/>

          <!-- bottom tier -->
          <path d="M44 214 v86 a116 14 0 0 0 232 0 v-86z" fill="url(#g-tier1)"/>
          <ellipse cx="160" cy="214" rx="116" ry="14" fill="#F0A4BA"/>
          <rect x="44" y="272" width="232" height="9" fill="url(#g-band)"/>
          <g fill="#FFF3E8" opacity=".85">
            <circle cx="62" cy="290" r="2.4"/><circle cx="86" cy="293" r="2.4"/><circle cx="112" cy="295" r="2.4"/>
            <circle cx="138" cy="296" r="2.4"/><circle cx="164" cy="296" r="2.4"/><circle cx="190" cy="295" r="2.4"/>
            <circle cx="216" cy="294" r="2.4"/><circle cx="240" cy="292" r="2.4"/><circle cx="262" cy="289" r="2.4"/>
          </g>
          <!-- cream drip on bottom tier -->
          <path d="M44 214 A116 14 0 0 0 276 214 L276 218.0 C276.0 238.1 260.0 238.1 260.0 225.1 C260.0 236.7 244.0 236.7 244.0 227.7 C244.0 235.3 228.0 235.3 228.0 229.3 C228.0 233.5 212.0 233.5 212.0 230.5 C212.0 240.3 196.0 240.3 196.0 231.3 C196.0 237.7 182.0 237.7 182.0 231.7 C182.0 241.0 168.0 241.0 168.0 232.0 C168.0 241.0 152.0 241.0 152.0 232.0 C152.0 238.0 134.0 238.0 134.0 231.6 C134.0 248.6 116.0 248.6 116.0 231.0 C116.0 234.0 100.0 234.0 100.0 230.0 C100.0 247.0 86.0 247.0 86.0 228.8 C86.0 231.8 70.0 231.8 70.0 226.8 C70.0 243.8 56.0 243.8 56.0 224.2 C56.0 227.2 44.0 227.2 44.0 218.0 L44 214Z" fill="url(#g-cream)"/>

          <!-- top tier -->
          <path d="M84 146 v66 a76 11 0 0 0 152 0 v-66z" fill="url(#g-tier2)"/>
          <ellipse cx="160" cy="146" rx="76" ry="11" fill="#FBE0E6"/>
          <rect x="84" y="196" width="152" height="7" fill="url(#g-band)"/>
          <path d="M84 146 A76 11 0 0 0 236 146 L236 149.0 C236.0 166.4 222.0 166.4 222.0 155.4 C222.0 165.8 206.0 165.8 206.0 157.8 C206.0 166.8 194.0 166.8 194.0 158.8 C194.0 167.6 180.0 167.6 180.0 159.6 C180.0 163.0 166.0 163.0 166.0 160.0 C166.0 171.0 152.0 171.0 152.0 159.9 C152.0 173.9 138.0 173.9 138.0 159.5 C138.0 164.5 122.0 164.5 122.0 158.5 C122.0 166.5 106.0 166.5 106.0 156.7 C106.0 159.7 90.0 159.7 90.0 153.3 C90.0 156.3 84.0 156.3 84.0 149.0 L84 146Z" fill="url(#g-cream)"/>

          <!-- roses -->
          <g class="cake__roses">
            <g transform="translate(70 222)"><circle r="11" fill="url(#g-rose)"/><path d="M-5 -1 a5 5 0 1 1 6 5 a3 3 0 1 1 -2 -6" fill="none" stroke="#6E1F3E" stroke-width="1.2" opacity=".7"/></g>
            <g transform="translate(250 222)"><circle r="11" fill="url(#g-rose)"/><path d="M-5 -1 a5 5 0 1 1 6 5 a3 3 0 1 1 -2 -6" fill="none" stroke="#6E1F3E" stroke-width="1.2" opacity=".7"/></g>
            <g transform="translate(160 230)"><circle r="13" fill="url(#g-rose)"/><path d="M-6 -1 a6 6 0 1 1 7 6 a3.5 3.5 0 1 1 -2.5 -7" fill="none" stroke="#6E1F3E" stroke-width="1.3" opacity=".7"/></g>
            <path d="M52 228 q-10 4 -12 12 q10 -2 14 -9z M268 228 q10 4 12 12 q-10 -2 -14 -9z M140 236 q-12 2 -16 10 q12 0 18 -7z M180 236 q12 2 16 10 q-12 0 -18 -7z" fill="#5E7A4F" opacity=".85"/>
            <g transform="translate(108 152)"><circle r="7" fill="url(#g-rose)"/></g>
            <g transform="translate(212 152)"><circle r="7" fill="url(#g-rose)"/></g>
          </g>
          <g fill="#E8C98B">
            <circle cx="96" cy="176" r="2"/><circle cx="118" cy="182" r="2"/><circle cx="140" cy="185" r="2"/>
            <circle cx="160" cy="186" r="2"/><circle cx="180" cy="185" r="2"/><circle cx="202" cy="182" r="2"/><circle cx="224" cy="176" r="2"/>
          </g>

          <!-- candles -->
          <g class="candles">
            <g class="candle" transform="translate(128 92)">
              <rect x="-5" y="0" width="10" height="56" rx="3" fill="url(#g-candle)"/>
              <path d="M-5 10 l10 -6 M-5 24 l10 -6 M-5 38 l10 -6 M-5 52 l10 -6" stroke="#E8C98B" stroke-width="2.4"/>
              <line x1="0" y1="0" x2="0" y2="-7" stroke="#3a2a22" stroke-width="1.6" stroke-linecap="round"/>
              <g class="flame"><ellipse class="flame__glow" cx="0" cy="-18" rx="18" ry="22"/><path class="flame__body" d="M0 -32 C7 -22 8 -14 0 -6 C-8 -14 -7 -22 0 -32z"/><path class="flame__core" d="M0 -22 C3 -17 3 -12 0 -8 C-3 -12 -3 -17 0 -22z"/></g>
              <g class="smoke"><path d="M0 -8 c-5 -8 5 -14 0 -22 c-5 -8 5 -14 0 -22"/></g>
            </g>
            <g class="candle" transform="translate(160 84)">
              <rect x="-5" y="0" width="10" height="64" rx="3" fill="url(#g-candle)"/>
              <path d="M-5 10 l10 -6 M-5 24 l10 -6 M-5 38 l10 -6 M-5 52 l10 -6 M-5 64 l10 -6" stroke="#E8C98B" stroke-width="2.4"/>
              <line x1="0" y1="0" x2="0" y2="-7" stroke="#3a2a22" stroke-width="1.6" stroke-linecap="round"/>
              <g class="flame"><ellipse class="flame__glow" cx="0" cy="-18" rx="18" ry="22"/><path class="flame__body" d="M0 -32 C7 -22 8 -14 0 -6 C-8 -14 -7 -22 0 -32z"/><path class="flame__core" d="M0 -22 C3 -17 3 -12 0 -8 C-3 -12 -3 -17 0 -22z"/></g>
              <g class="smoke"><path d="M0 -8 c-5 -8 5 -14 0 -22 c-5 -8 5 -14 0 -22"/></g>
            </g>
            <g class="candle" transform="translate(192 92)">
              <rect x="-5" y="0" width="10" height="56" rx="3" fill="url(#g-candle)"/>
              <path d="M-5 10 l10 -6 M-5 24 l10 -6 M-5 38 l10 -6 M-5 52 l10 -6" stroke="#E8C98B" stroke-width="2.4"/>
              <line x1="0" y1="0" x2="0" y2="-7" stroke="#3a2a22" stroke-width="1.6" stroke-linecap="round"/>
              <g class="flame"><ellipse class="flame__glow" cx="0" cy="-18" rx="18" ry="22"/><path class="flame__body" d="M0 -32 C7 -22 8 -14 0 -6 C-8 -14 -7 -22 0 -32z"/><path class="flame__core" d="M0 -22 C3 -17 3 -12 0 -8 C-3 -12 -3 -17 0 -22z"/></g>
              <g class="smoke"><path d="M0 -8 c-5 -8 5 -14 0 -22 c-5 -8 5 -14 0 -22"/></g>
            </g>
          </g>
        </svg>
      </div>

      <div class="wish" id="wish" aria-live="polite">
        <div class="wish__inner" id="wish-inner" hidden>
          <span class="twinkle twinkle--1" aria-hidden="true"></span>
          <span class="twinkle twinkle--2" aria-hidden="true"></span>
          <span class="twinkle twinkle--3" aria-hidden="true"></span>
          <span class="twinkle twinkle--4" aria-hidden="true"></span>
          <p class="wish__title" data-t="cake.wishTitle"></p>
          <p class="wish__text" data-t="cake.wishText"></p>
        </div>
      </div>

      <div class="cake-actions">
        <button class="btn btn--primary" id="candle-btn" type="button">
          <span id="candle-btn-label" data-t="cake.button"></span>
        </button>
      </div>
    </section>

    <!-- ===========================================================
         6. FINAL GRAND REVEAL
         =========================================================== -->
    <section class="finale" id="finale" aria-labelledby="finale-title">
      <div class="finale__petals" id="finale-petals" aria-hidden="true"></div>
      <figure class="finale__portrait">
        <div class="finale__halo" aria-hidden="true"></div>
        <div class="arch arch--finale" id="finale-arch">
          <img id="finale-img" class="arch__img" alt="" loading="lazy" decoding="async">
        </div>
      </figure>

      <div class="finale__text">
        <p class="finale__step finale__line1" data-t="finale.line1"></p>
        <p class="finale__step finale__line2">
          <span data-t="finale.line2"></span>
        </p>
        <h2 class="finale__step finale__title" id="finale-title" data-t="finale.headline"></h2>
        <p class="finale__step finale__message" data-t="finale.message"></p>
        <div class="finale__step">
          <button class="btn btn--ghost btn--small" id="replay-btn" type="button">
            <span data-t="finale.replayButton"></span>
          </button>
        </div>
      </div>
    </section>

    <footer class="footer">
      <p data-t="finale.footer"></p>
      <p class="footer__sender" id="footer-sender" hidden></p>
    </footer>
  </main>

  <!-- Photo viewer (native modal dialog: Esc + focus handling built in) -->
  <dialog class="viewer" id="viewer" aria-labelledby="viewer-title">
    <div class="viewer__inner">
      <button class="viewer__close" id="viewer-close" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="visually-hidden" data-t="viewer.close"></span>
      </button>
      <figure class="viewer__figure">
        <img id="viewer-img" alt="" decoding="async">
        <figcaption class="viewer__caption">
          <span class="viewer__count" id="viewer-count"></span>
          <strong id="viewer-title"></strong>
          <span id="viewer-text"></span>
        </figcaption>
      </figure>
      <button class="viewer__nav viewer__nav--prev" id="viewer-prev" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="visually-hidden" data-t="viewer.prev"></span>
      </button>
      <button class="viewer__nav viewer__nav--next" id="viewer-next" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="visually-hidden" data-t="viewer.next"></span>
      </button>
    </div>
  </dialog>

  <!-- Music control (stays hidden unless a music file actually loads) -->
  <button class="music" id="music-btn" type="button" aria-pressed="false" hidden>
    <span class="music__bars" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="music__label" id="music-label"></span>
  </button>
  <audio id="music" preload="none" loop></audio>

</body>
</html>
